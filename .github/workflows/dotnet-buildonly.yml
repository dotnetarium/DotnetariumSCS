# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: BuildTest

on:
  push:
    branches: [ "main", "final-fx-1.3.0" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Resolve analyzer 1.3.0 for pull request
      if: github.event_name == 'pull_request'
      shell: pwsh
      run: |
        # Build the reviewed analyzer commit until its 1.3.0 package reaches NuGet.
        $feed = Join-Path $env:RUNNER_TEMP 'analyzer-feed'
        New-Item -ItemType Directory -Path $feed -Force | Out-Null
        $packageUrl = 'https://api.nuget.org/v3-flatcontainer/dotnetarium.analyzers.scs/1.3.0/dotnetarium.analyzers.scs.1.3.0.nupkg'
        try {
          Invoke-WebRequest -Uri $packageUrl -Method Head -ErrorAction Stop | Out-Null
        } catch {
          $source = Join-Path $env:RUNNER_TEMP 'analyzer-source'
          git clone https://github.com/dotnetarium/Dotnetarium.Analyzers.SCS.git $source
          git -C $source checkout 619bf6c6b9cf3ddc64cdb9734fc8eaa085f3bd9c
          $project = Join-Path $source 'DotnetariumSCS/DotnetariumSCS.csproj'
          dotnet build $project -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack $project -c Release --no-build -o $feed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        $config = Join-Path $env:RUNNER_TEMP 'NuGet.Config'
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <configuration><packageSources><clear /><add key="analyzer-preview" value="$feed" /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>
        "@ | Set-Content -Path $config
        "ANALYZER_NUGET_CONFIG=$config" >> $env:GITHUB_ENV
      
    - name: Build and package global tool
      shell: pwsh
      run: |
        if ($env:ANALYZER_NUGET_CONFIG) {
          dotnet restore "DotnetariumSCS.Tool/.NET Core/dotnetarium-scan.csproj" --configfile $env:ANALYZER_NUGET_CONFIG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build "DotnetariumSCS.Tool/.NET Core/dotnetarium-scan.csproj" --configuration Release --no-restore
        } else {
          dotnet build "DotnetariumSCS.Tool/.NET Core/dotnetarium-scan.csproj" --configuration Release
        }

    - name: Setup MSBuild for .NET Framework
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '[17.0,18.0)'

    - name: Build .NET Framework 4.8 executable
      shell: pwsh
      run: |
        $publish = Join-Path $env:RUNNER_TEMP 'fx-publish'
        dotnet publish "DotnetariumSCS.Tool/.NET 4.x/dotnetarium-scan.csproj" -c Release -o $publish
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Check .NET Framework project scan and package ZIP
      shell: pwsh
      run: |
        $probe = Join-Path $env:RUNNER_TEMP 'fx-probe'
        New-Item -ItemType Directory -Path $probe -Force | Out-Null
        @'
        <Project ToolsVersion="Current" DefaultTargets="Build" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
          <PropertyGroup>
            <TargetFrameworkVersion>v4.8</TargetFrameworkVersion>
            <OutputType>Library</OutputType>
            <AssemblyName>FxProbe</AssemblyName>
            <OutputPath>bin\Debug\</OutputPath>
          </PropertyGroup>
          <ItemGroup>
            <Reference Include="System" />
            <Reference Include="System.Web" />
            <Compile Include="Probe.cs" />
          </ItemGroup>
          <Import Project="$(MSBuildToolsPath)\Microsoft.CSharp.targets" />
        </Project>
        '@ | Set-Content (Join-Path $probe 'FxProbe.csproj')
        @'
        using System.Web;
        public class Probe
        {
            public void Run(HttpRequest request, HttpResponse response)
            {
                response.Write(request.QueryString["value"]);
            }
        }
        '@ | Set-Content (Join-Path $probe 'Probe.cs')
        $msbuildDir = Split-Path (Get-Command msbuild.exe).Source -Parent
        if ((Split-Path $msbuildDir -Leaf) -eq 'amd64') { $msbuildDir = Split-Path $msbuildDir -Parent }
        $publish = Join-Path $env:RUNNER_TEMP 'fx-publish'
        $output = & (Join-Path $publish 'dotnetarium-scan.exe') (Join-Path $probe 'FxProbe.csproj') -v "--sdk-path=$msbuildDir" 2>&1
        $output | Out-String | Write-Output
        if ($LASTEXITCODE -ne 0 -or ($output | Out-String) -notmatch 'SCS0029') {
          throw 'The .NET Framework executable did not report the expected SCS0029 finding.'
        }
        $zip = Join-Path $env:RUNNER_TEMP 'dotnetarium-scan4x.zip'
        [IO.Compression.ZipFile]::CreateFromDirectory($publish, $zip)
        "FX_ZIP=$zip" >> $env:GITHUB_ENV

    - name: Upload .NET Framework ZIP
      uses: actions/upload-artifact@v4
      with:
        retention-days: 7
        name: dotnetarium-scan4x
        path: ${{ env.FX_ZIP }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        retention-days: 7
        name: packages
        path: |
          ./DotnetariumSCS.Tool/.NET Core/bin/Release/*.nupkg
